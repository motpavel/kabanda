name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: kabanda
          POSTGRES_USER: kabanda
          POSTGRES_PASSWORD: kabanda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kabanda -d kabanda"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kabanda:kabanda@127.0.0.1:5432/kabanda
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @kabanda/api test:postgres

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: kabanda_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kabanda_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://kabanda_e2e:e2e-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/kabanda_e2e
      NODE_ENV: test
      KABANDA_E2E: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create exact synthetic run ID
        run: echo "E2E_RUN_ID=$(node -e 'console.log(require(\"node:crypto\").randomUUID())')" >> "$GITHUB_ENV"
      - name: Mark disposable E2E database
        env:
          PGPASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ROLE_PASSWORD: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          psql "postgresql://postgres@127.0.0.1:5432/kabanda_e2e" -v ON_ERROR_STOP=1 -v role_password="$E2E_ROLE_PASSWORD" <<'SQL'
          CREATE ROLE kabanda_e2e LOGIN PASSWORD :'role_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER DATABASE kabanda_e2e OWNER TO kabanda_e2e;
          COMMENT ON DATABASE kabanda_e2e IS 'kabanda-e2e-disposable-v1';
          SQL
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
