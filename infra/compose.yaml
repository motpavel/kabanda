name: kabanda-local

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: kabanda
      POSTGRES_USER: kabanda
      POSTGRES_PASSWORD: kabanda
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabanda -d kabanda"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kabanda_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kabanda
      MINIO_ROOT_PASSWORD: kabanda-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kabanda_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 kabanda kabanda-local-only && mc mb --ignore-existing local/kabanda-private && mc anonymous set none local/kabanda-private

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  kabanda_postgres:
  kabanda_minio:
