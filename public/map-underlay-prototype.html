<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>КАБАНДА — проба Яндекс-подложки</title>
    <style>
      :root {
        color: #232a35;
        background: #efefec;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }

      .shell {
        display: grid;
        width: min(100%, 520px);
        min-height: 100vh;
        min-height: 100dvh;
        grid-template-rows: auto 1fr auto;
        margin: 0 auto;
        overflow: hidden;
        background: #f7f7f5;
        box-shadow: 0 0 60px rgba(35, 42, 53, 0.12);
      }

      header {
        display: flex;
        min-height: 64px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: max(12px, env(safe-area-inset-top)) 16px 12px;
        border-bottom: 1px solid #dedfdb;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      header span,
      footer span {
        color: #747c86;
        font-size: 12px;
      }

      .provider {
        border-radius: 999px;
        padding: 7px 10px;
        color: #232a35;
        background: #fff;
        box-shadow: 0 2px 8px rgba(35, 42, 53, 0.08);
        font-size: 12px;
        font-weight: 700;
      }

      .map {
        position: relative;
        min-height: 480px;
        overflow: hidden;
        background: #e5e7e3;
      }

      .map-stage,
      .map-stage iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .map-stage {
        transform: translate3d(0, 0, 0);
        will-change: transform;
      }

      .map-stage iframe {
        opacity: 1;
        border: 0;
        pointer-events: none;
        transition: opacity 280ms ease;
      }

      .map-stage iframe.map-frame--incoming { opacity: 0; }
      .map-stage iframe.map-frame--outgoing { opacity: 0; }

      .points-layer {
        position: absolute;
        z-index: 1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .point {
        position: absolute;
        width: 19px;
        height: 19px;
        transform: translate(-50%, -50%);
        border: 3px solid rgba(255, 255, 255, 0.96);
        border-radius: 50%;
        background: #777d84;
        box-shadow:
          0 1px 3px rgba(35, 42, 53, 0.32),
          0 0 0 1px rgba(35, 42, 53, 0.1);
      }

      .points-layer.is-animating .point {
        transition:
          left 360ms cubic-bezier(0.22, 1, 0.36, 1),
          top 360ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .point::after {
        position: absolute;
        inset: 4px;
        border-radius: inherit;
        background: #fff;
        content: "";
      }

      .note {
        position: absolute;
        z-index: 4;
        top: 12px;
        left: 50%;
        width: max-content;
        max-width: calc(100% - 24px);
        transform: translateX(-50%);
        border-radius: 999px;
        padding: 8px 12px;
        color: #232a35;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 4px 18px rgba(35, 42, 53, 0.14);
        font-size: 12px;
        font-weight: 700;
        pointer-events: none;
      }

      .gesture-layer {
        position: absolute;
        z-index: 3;
        inset: 0;
        cursor: grab;
        touch-action: none;
      }

      .gesture-layer.is-dragging { cursor: grabbing; }

      .zoom-controls {
        position: absolute;
        z-index: 5;
        top: 50%;
        right: 8px;
        display: grid;
        overflow: hidden;
        transform: translateY(-50%);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(35, 42, 53, 0.22);
      }

      .zoom-controls button {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 0;
        color: #353b43;
        background: #fff;
        font: 400 28px/1 Arial, sans-serif;
        cursor: pointer;
      }

      .zoom-controls button + button { border-top: 1px solid #e1e2df; }
      .zoom-controls button:hover { background: #f4f4f2; }
      .zoom-controls button:focus-visible {
        position: relative;
        outline: 2px solid #5c6470;
        outline-offset: -3px;
      }
      .zoom-controls button:disabled {
        color: #b7bbc0;
        cursor: default;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 16px max(13px, env(safe-area-inset-bottom));
        border-top: 1px solid #dedfdb;
        background: #fff;
      }

      footer strong { font-size: 13px; }

      @media (min-width: 700px) {
        body { padding: 24px; }
        .shell {
          min-height: calc(100dvh - 48px);
          border: 1px solid #dedfdb;
          border-radius: 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .map-stage iframe,
        .points-layer.is-animating .point { transition: none; }
      }
    </style>

      const map = document.querySelector(".map");
      const stage = document.querySelector(".map-stage");
      let frame = document.querySelector("iframe");
      const layer = document.querySelector(".points-layer");
      const gestureLayer = document.querySelector(".gesture-layer");
      const zoomInButton = document.querySelector('[data-zoom="in"]');
      const zoomOutButton = document.querySelector('[data-zoom="out"]');
      const resetButton = document.querySelector('[data-action="reset"]');
      let dragStart = null;
      let dragOffset = { x: 0, y: 0 };
      let pendingView = null;
      let wheelLocked = false;

      function worldPoint([longitude, latitude], targetZoom = zoom) {
        const scale = 256 * 2 ** targetZoom;
        const sin = Math.sin((latitude * Math.PI) / 180);
        return {
          x: ((longitude + 180) / 360) * scale,
          y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * scale
        };
      }

      function coordinatesFromWorld({ x, y }, targetZoom = zoom) {
        const scale = 256 * 2 ** targetZoom;
        const longitude = (x / scale) * 360 - 180;
        const mercator = Math.PI * (1 - (2 * y) / scale);
        const latitude = (Math.atan(Math.sinh(mercator)) * 180) / Math.PI;
        return [longitude, latitude];
      }

      function mapUrl(nextCenter, nextZoom) {
        const ll = `${nextCenter[0].toFixed(6)},${nextCenter[1].toFixed(6)}`;
        return `https://yandex.ru/map-widget/v1/?ll=${encodeURIComponent(ll)}&z=${nextZoom}`;
      }

      function syncControls() {
        zoomInButton.disabled = zoom >= MAX_ZOOM || Boolean(pendingView);
        zoomOutButton.disabled = zoom <= MIN_ZOOM || Boolean(pendingView);
        resetButton.disabled = Boolean(pendingView);
      }

      function ensurePoints() {
        if (layer.children.length === STORES.length) return;
        layer.replaceChildren(
          ...STORES.map(() => {
            const point = document.createElement("span");
            point.className = "point";
            return point;
          })
        );
      }

      function renderPoints() {
        ensurePoints();
        const projectedCenter = worldPoint(center);
        const { width, height } = layer.getBoundingClientRect();
        STORES.forEach((store, index) => {
          const projected = worldPoint([store.longitude, store.latitude]);
          const point = layer.children[index];
          point.dataset.shopId = String(store.id);
          point.dataset.shopNumber = store.shopNumber;
          point.title = `К&Б №${store.shopNumber} · ${store.address} · ${store.hours}`;
          point.style.left = `${width / 2 + projected.x - projectedCenter.x}px`;
          point.style.top = `${height / 2 + projected.y - projectedCenter.y}px`;
        });
      }

      function requestView(nextCenter, nextZoom) {
        if (pendingView) return;
        pendingView = {
          center: nextCenter,
          zoom: nextZoom,
          isZoom: nextZoom !== zoom
        };
        syncControls();

        const incomingFrame = frame.cloneNode();
        incomingFrame.className = "map-frame--incoming";
        incomingFrame.src = mapUrl(nextCenter, nextZoom);
        incomingFrame.title = "Яндекс Карты — обновлённый вид";
        incomingFrame.addEventListener("load", () => finishViewChange(incomingFrame), { once: true });
        stage.insertBefore(incomingFrame, layer);
      }

      function finishViewChange(incomingFrame) {
        if (!pendingView) return;
        const oldFrame = frame;
        const shouldAnimateZoom = pendingView.isZoom;
        center = pendingView.center;
        zoom = pendingView.zoom;

        if (shouldAnimateZoom) layer.classList.add("is-animating");

        requestAnimationFrame(() => {
          stage.style.transform = "translate3d(0, 0, 0)";
          dragOffset = { x: 0, y: 0 };
          renderPoints();
          incomingFrame.classList.remove("map-frame--incoming");

          if (shouldAnimateZoom) {
            oldFrame.classList.add("map-frame--outgoing");
          } else {
            oldFrame.remove();
          }

          window.setTimeout(() => {
            oldFrame.remove();
            layer.classList.remove("is-animating");
            frame = incomingFrame;
            pendingView = null;
            syncControls();
          }, shouldAnimateZoom ? 380 : 0);
        });
      }

      function requestZoom(nextZoom) {
        const clampedZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
        if (clampedZoom === zoom) return;
        requestView(center, clampedZoom);
      }

      function finishDrag(event) {
        if (!dragStart || pendingView) return;
        gestureLayer.releasePointerCapture?.(event.pointerId);
        gestureLayer.classList.remove("is-dragging");
        dragStart = null;

        if (Math.abs(dragOffset.x) < 2 && Math.abs(dragOffset.y) < 2) {
          stage.style.transform = "translate3d(0, 0, 0)";
          return;
        }

        const projectedCenter = worldPoint(center);
        const nextCenter = coordinatesFromWorld({
          x: projectedCenter.x - dragOffset.x,
          y: projectedCenter.y - dragOffset.y
        });
        requestView(nextCenter, zoom);
      }

      gestureLayer.addEventListener("pointerdown", (event) => {
        if (pendingView || event.button !== 0) return;
        dragStart = { x: event.clientX, y: event.clientY };
        dragOffset = { x: 0, y: 0 };
        gestureLayer.setPointerCapture(event.pointerId);
        gestureLayer.classList.add("is-dragging");
      });

      gestureLayer.addEventListener("pointermove", (event) => {
        if (!dragStart || pendingView) return;
        dragOffset = {
          x: event.clientX - dragStart.x,
          y: event.clientY - dragStart.y
        };
        stage.style.transform = `translate3d(${dragOffset.x}px, ${dragOffset.y}px, 0)`;
      });

      gestureLayer.addEventListener("pointerup", finishDrag);
      gestureLayer.addEventListener("pointercancel", finishDrag);
      gestureLayer.addEventListener("dblclick", (event) => {
        event.preventDefault();
        requestZoom(zoom + 1);
      });

      gestureLayer.addEventListener("wheel", (event) => {
        event.preventDefault();
        if (wheelLocked || pendingView) return;
        wheelLocked = true;
        requestZoom(zoom + (event.deltaY < 0 ? 1 : -1));
        window.setTimeout(() => { wheelLocked = false; }, 450);
      }, { passive: false });

      zoomInButton.addEventListener("click", () => requestZoom(zoom + 1));
      zoomOutButton.addEventListener("click", () => requestZoom(zoom - 1));
      resetButton.addEventListener("click", () => requestView([53.2045, 56.8528], 12));
      new ResizeObserver(renderPoints).observe(layer);
      renderPoints();
      syncControls();
    </script>
